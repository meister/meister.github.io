name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash -n scripts/build.sh
      - run: bash scripts/build.sh latest
      - run: test -s index.md && ! grep -q $'\033' index.md
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
